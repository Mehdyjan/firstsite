<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صفحه اطلاع‌رسانی</title>
  <style>
    body {
      font-family: Tahoma, sans-serif;
      line-height: 1.8;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background-color: #f4f6f8;
      color: #222;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    h1 { color: #1a73e8; margin-top: 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>عنوان صفحه</h1>
    <p>متن و اطلاعات مورد نظر شما در این بخش نمایش داده می‌شود.</p>
  </div>
</body>
</html>
